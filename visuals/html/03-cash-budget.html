<body><main class="frame"><p class="eyebrow">Waterfall · BOODONGSAN</p><h1>집값보다 먼저 자금 계산</h1><p class="intro">현금 3억원, 비상자금 3,000만원, 대출 3억원을 가정합니다. 집값 6억원과 부대비용 2,000만원도 가상값입니다. 대출 승인을 뜻하지 않습니다.</p>
