<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-commute-title 06-commute-desc" id="d-06-commute-root"><title id="06-commute-title">역까지 거리보다 전체 이동시간</title><desc id="06-commute-desc">A는 역까지 5분과 나머지 50분으로 총 55분, B는 역까지 12분과 나머지 30분으로 총 42분인 가상 출퇴근 사례입니다.</desc><defs>
      <style>#d-06-commute-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; }
      #d-06-commute-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-06-commute-root .intro { color:#4f5d75; font-size:14px; max-width:820px; margin:0 0 20px; }
      #d-06-commute-root .diagram-container { width:100%; overflow-x:auto; }
      #d-06-commute-root a { color:#2e5aa8; text-underline-offset:3px; }
      #d-06-commute-root .foot { border-top:1px solid #bfc0c0; margin-top:20px; padding-top:12px; font-size:13px; color:#4f5d75; }
      #d-06-commute-root .contents { display:flex; flex-wrap:wrap; gap:8px 20px; padding:12px 0 24px; }
      #d-06-commute-root .gallery-section { margin:40px 0 56px; break-inside:avoid; }
      #d-06-commute-root .lesson-link { font-size:14px; margin-top:12px; }
      #d-06-commute-root .diagram-container { overflow-x:visible; }
      #d-06-commute-root .contents { display:none; }
      #d-06-commute-root .gallery-section { break-before:page; margin:0; }</style><marker id="d-06-commute-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="d-06-commute-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="d-06-commute-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/><text x="280" y="88" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">A집 / 전체 55분</text><text x="704" y="88" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">B집 / 전체 42분</text><text x="80" y="128" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">단위: 분</text><line x1="80" y1="448" x2="880" y2="448" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="452" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">0</text><line x1="80" y1="378" x2="880" y2="378" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="382" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-s