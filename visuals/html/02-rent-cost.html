<body><main class="frame"><p class="eyebrow">Waterfall · BOODONGSAN</p><h1>전세와 월세의 비용 비교</h1><p class="intro">전세 3억원과 보증금 5,000만원·월세 90만원을 비교합니다. 전액 자기자금, 연 기회비용 4%, 다른 비용은 같다고 가정합니다. 기회비용은 현금 출금액이 아닙니다. 소수점 한 자리로 반올림합니다.</p>
