<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-area-title 01-area-desc" id="d-01-area-root"><title id="01-area-title">전용·공급·서비스면적</title><desc id="01-area-desc">공급면적 안에 전용면적과 주거공용면적이 포함되고 서비스면적은 별도로 구분됨을 설명합니다.</desc><defs>
      <style>#d-01-area-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; }
      #d-01-area-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-01-area-root .intro { color:#4f5d75; font-size:14px; max-width:820px; margin:0 0 20px; }
      #d-01-area-root .diagram-container { width:100%; overflow-x:auto; }
      #d-01-area-root a { color:#2e5aa8; text-underline-offset:3px; }
      #d-01-area-root .foot { border-top:1px solid #bfc0c0; margin-top:20px; padding-top:12px; font-size:13px; color:#4f5d75; }
      #d-01-area-root .contents { display:flex; flex-wrap:wrap; gap:8px 20px; padding:12px 0 24px; }
      #d-01-area-root .gallery-section { margin:40px 0 56px; break-inside:avoid; }
      #d-01-area-root .lesson-link { font-size:14px; margin-top:12px; }
      #d-01-area-root .diagram-container { overflow-x:visible; }
      #d-01-area-root .contents { display:none; }
      #d-01-area-root .gallery-section { break-before:page; margin:0; }</style><marker id="d-01-area-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="d-01-area-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="d-01-area-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/><text x="40" y="68" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">공급면적 80㎡ = 전용 59㎡ + 주거공용 21㎡</text><text x="40" y="100" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">가상 면적의 포함 관계입니다. 도형 크기는 실제 면적 비율이나 평면도를 뜻하지 않습니다.</text><rect x="80" y="160" width="560" height="280" fill="#2d3142" stroke="#4f5d75" stroke-width="1" rx="8" fill-opacity="0.025"/><rect x="104" y="152" width="224" height="16" fill="#f5f5f5"/><text x="112" y="164" fill="#2d3142" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">공급면적 / 두 면적의 합</text><rect x="112" y="224" width="320" height="160" fill="#bf4520" stroke="#bf4520" stroke-width="1" rx="8" fill-opacity="0.08"/><rect x="128" y="216" width="176" height="16" fill="#f5f5f5"/><text x="136" y="228" fill="#bf4520" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">전용면적 / 59㎡</text><text x="272" y="292" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">우리 세대가 쓰는 공간</text><text x="272" y="324" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">방·거실·주방 등</text><rect x="464" y="224" width="144" height="160" fill="#2d3142" stroke="#2d3142" stroke-width="1" rx="8" fill-opacity="0.05"/><text x="536" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">주거공용 21㎡</text><text x="536" y="296" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">계단·복도 등</text><text x="536" y="328" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">함께 쓰는 공간</text><rect x="680" y="256" width="200" height="112" fill="#2d3142" stroke="#4f5d75" stroke-width="1" rx="8" stroke-dasharray="4,3" fill-opacity="0.02"/><text x="780" y="292" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">서비스면적</text><text x="780" y="324" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">발코니 등 별도 구분</text><text x="80" y="492" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">비교할 때는 전용면적과 공급면적을 서로 섞지 않습니다.</text><line x1="40" y1="544" x2="920" y2="544" stroke="#bfc0c0" stroke-width="1" /><rect x="40" y="556" width="12" height="12" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="60" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">전용 공간</text><rect x="216" y="556" width="12" height="12" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.025"/><text x="236" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">공급 범위</text><text x="40" y="592" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">근거: 1강 · 숫자는 학습용 가정 · 광고 평형의 면적 기준을 확인하세요.</text></svg>
