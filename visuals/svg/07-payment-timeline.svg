<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-payment-timeline-title 07-payment-timeline-desc" id="d-07-payment-timeline-root"><title id="07-payment-timeline-title">분양 대금은 날짜마다 필요합니다</title><desc id="07-payment-timeline-desc">가상 6억원 분양의 계약금 6천만원, 중도금 3억6천만원, 잔금 1억8천만원을 가상 0·6·24개월 시점에 표시합니다.</desc><defs>
      <style>#d-07-payment-timeline-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; }
      #d-07-payment-timeline-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-07-payment-timeline-root .intro { color:#4f5d75; font-size:14px; max-width:820px; margin:0 0 20px; }
      #d-07-payment-timeline-root .diagram-container { width:100%; overflow-x:auto; }
      #d-07-payment-timeline-root a { color:#2e5aa8; text-underline-offset:3px; }
      #d-07-payment-timeline-root .foot { border-top:1px solid #bfc0c0; margin-top:20px; padding-top:12px; font-size:13px; color:#4f5d75; }
      #d-07-payment-timeline-root .contents { display:flex; flex-wrap:wrap; gap:8px 20px; padding:12px 0 24px; }
      #d-07-payment-timeline-root .gallery-section { margin:40px 0 56px; break-inside:avoid; }
      #d-07-payment-timeline-root .lesson-link { font-size:14px; margin-top:12px; }
      #d-07-payment-timeline-root .diagram-container { overflow-x:visible; }
      #d-07-payment-timeline-root .contents { display:none; }
      #d-07-payment-timeline-root .gallery-section { break-before:page; margin:0; }</style><marker id="d-07-payment-timeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="d-07-payment-timeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="d-07-payment-timeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/><text x="40" y="68" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">가상 분양가 6억원 / 계약금 10% · 중도금 60% · 잔금 30%</text><text x="40" y="104" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">납부 시점도 가정입니다. 실제 비율·회차·일정·대출 조건은 공고에서 확인합니다.</text><line x1="112" y1="320" x2="880" y2="320" stroke="#4f5d75" stroke-width="1" /><line x1="144.0" y1="312" x2="144.0" y2="328" stroke="#4f5d75" stroke-width="1" /><text x="156.0" y="352" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">0개월</text><line x1="304.0" y1="312" x2="304.0" y2="328" stroke="#4f5d75" stroke-width="1" /><text x="316.0" y="352" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">6개월</text><line x1="464.0" y1="312" x2="464.0" y2="328" stroke="#4f5d75" stroke-width="1" /><text x="476.0" y="352" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">12개월</text><line x1="624.0" y1="312" x2="624.0" y2="328" stroke="#4f5d75" stroke-width="1" /><text x="636.0" y="352" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">18개월</text><line x1="784.0" y1="312" x2="784.0" y2="328" stroke="#4f5d75" stroke-width="1" /><text x="796.0" y="352" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">24개월</text><line x1="144.0" y1="320" x2="144.0" y2="244" stroke="#4f5d75" stroke-width="1" /><circle cx="144.0" cy="320" r="6" fill="#bf4520"/><text x="144.0" y="216" fill="#bf4520" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">계약금</text><text x="144.0" y="240" fill="#bf4520" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">6,000만원</text><line x1="304.0" y1="320" x2="304.0" y2="396" stroke="#4f5d75" stroke-width="1" /><circle cx="304.0" cy="320" r="4" fill="#2d3142"/><text x="304.0" y="424" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">중도금</text><text x="304.0" y="448" fill="#2d3142" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">3억6,000만원</text><line x1="784.0" y1="320" x2="784.0" y2="244" stroke="#4f5d75" stroke-width="1" /><circle cx="784.0" cy="320" r="4" fill="#2d3142"/><text x="784.0" y="216" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">잔금</text><text x="784.0" y="240" fill="#2d3142" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">1억8,000만원</text><text x="40" y="512" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">중도금 대출이 있어도 잔금 대출과 부대비용은 따로 확인합니다.</text><line x1="40" y1="544" x2="920" y2="544" stroke="#bfc0c0" stroke-width="1" /><rect x="40" y="556" width="12" height="12" fill="#bf4520" stroke="#bf4520" stroke-width="1"/><text x="60" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">처음 필요한 계약금</text><rect x="216" y="556" width="12" height="12" fill="#2d3142" stroke="#2d3142" stroke-width="1"/><text x="236" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">이후의 납부 단계</text><text x="40" y="592" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">가상 일정·금액 · 중도금은 실제로 여러 회차일 수 있음 · 8강의 공고 읽기 실습과 함께 봅니다.</text></svg>
