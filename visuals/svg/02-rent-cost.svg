      #d-02-rent-cost-root .intro { color:#4f5d75; font-size:14px; max-width:820px; margin:0 0 20px; }
      #d-02-rent-cost-root .diagram-container { width:100%; overflow-x:auto; }
      #d-02-rent-cost-root a { color:#2e5aa8; text-underline-offset:3px; }
      #d-02-rent-cost-root .foot { border-top:1px solid #bfc0c0; margin-top:20px; padding-top:12px; font-size:13px; color:#4f5d75; }
      #d-02-rent-cost-root .contents { display:flex; flex-wrap:wrap; gap:8px 20px; padding:12px 0 24px; }
      #d-02-rent-cost-root .gallery-section { margin:40px 0 56px; break-inside:avoid; }
      #d-02-rent-cost-root .lesson-link { font-size:14px; margin-top:12px; }
      #d-02-rent-cost-root .diagram-container { overflow-x:visible; }
      #d-02-rent-cost-root .contents { display:none; }
      #d-02-rent-cost-root .gallery-section { break-before:page; margin:0; }</style><marker id="d-02-rent-cost-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="d-02-rent-cost-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="d-02-rent-cost-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/><text x="40" y="68" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">보증금에 묶이는 돈이 줄고, 월세 지출이 더해집니다.</text><text x="40" y="100" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">가상 사례 / 전액 자기자금 / 연 기회비용 4% / 관리비 등 동일 / 소수점 한 자리 반올림</text><text x="80" y="132" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">단위: 만원/월</text><line x1="80" y1="448" x2="880" y2="448" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="452" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">0</text><line x1="80" y1="392" x2="880" y2="392" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="396" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;App