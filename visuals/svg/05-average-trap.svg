<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="05-average-trap-title 05-average-trap-desc" id="d-05-average-trap-root"><title id="05-average-trap-title">평균가격 상승의 함정</title><desc id="05-average-trap-desc">A월에는 소형 4억원 거래 두 건, B월에는 소형 4억원과 대형 8억원 거래가 있어 평균이 4억원에서 6억원으로 높아져도 소형 가격은 변하지 않는 가상 사례입니다.</desc><defs>
      <style>#d-05-average-trap-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; }
      #d-05-average-trap-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-05-average-trap-root .intro { color:#4f5d75; font-size:14px; max-width:820px; margin:0 0 20px; }
      #d-05-average-trap-root .diagram-container { width:100%; overflow-x:auto; }
      #d-05-average-trap-root a { color:#2e5aa8; text-underline-offset:3px; }
      #d-05-average-trap-root .foot { border-top:1px solid #bfc0c0; margin-top:20px; padding-top:12px; font-size:13px; color:#4f5d75; }
      #d-05-average-trap-root .contents { display:flex; flex-wrap:wrap; gap:8px 20px; padding:12px 0 24px; }
      #d-05-average-trap-root .gallery-section { margin:40px 0 56px; break-inside:avoid; }
      #d-05-average-trap-root .lesson-link { font-size:14px; margin-top:12px; }
      #d-05-average-trap-root .diagram-container { overflow-x:visible; }
      #d-05-average-trap-root .contents { display:none; }
      #d-05-average-trap-root .gallery-section { break-before:page; margin:0; }</style><marker id="d-05-average-trap-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="d-05-average-trap-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="d-05-average-trap-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/><text x="280" y="88" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">A월 / 평균 4억원</text><text x="704" y="88" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">B월 / 평균 6억원</text><text x="80" y="128" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">단위: 억원</text><line x1="80" y1="448" x2="880" y2="448" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="452" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">0</text><line x1="80" y1="378" x2="880" y2="378" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="382" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">2</text><line x1="80" y1="308" x2="880" y2="308" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="312" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">4</text><line x1="80" y1="238" x2="880" y2="238" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="242" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">6</text><line x1="80" y1="168" x2="880" y2="168" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="172" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">8</text><line x1="80" y1="168" x2="80" y2="448" stroke="#bfc0c0" stroke-width="1" /><line x1="80" y1="448" x2="880" y2="448" stroke="#bfc0c0" stroke-width="1" /><rect x="112" y="308" width="112" height="140" fill="#f5f5f5"/><rect x="112" y="308" width="112" height="140" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" data-value="4" data-name="소형 1" fill-opacity="0.15"/><text x="168" y="296" fill="#4f5d75" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">4억원</text><text x="168" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">소형 1</text><rect x="288" y="308" width="112" height="140" fill="#f5f5f5"/><rect x="288" y="308" width="112" height="140" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" data-value="4" data-name="소형 2" fill-opacity="0.15"/><text x="344" y="296" fill="#4f5d75" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">4억원</text><text x="344" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">소형 2</text><rect x="560" y="308" width="112" height="140" fill="#f5f5f5"/><rect x="560" y="308" width="112" height="140" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" data-value="4" data-name="소형" fill-opacity="0.15"/><text x="616" y="296" fill="#4f5d75" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">4억원</text><text x="616" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">소형</text><rect x="736" y="168" width="112" height="280" fill="#f5f5f5"/><rect x="736" y="168" width="112" height="280" fill="#bf4520" stroke="#bf4520" stroke-width="1" data-value="8" data-name="대형" fill-opacity="0.12"/><text x="792" y="156" fill="#bf4520" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">8억원</text><text x="792" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">대형</text><text x="80" y="520" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">평균은 50% 상승했지만, 비교한 소형 거래 가격은 4억원으로 같습니다.</text><line x1="40" y1="544" x2="920" y2="544" stroke="#bfc0c0" stroke-width="1" /><rect x="40" y="556" width="12" height="12" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" fill-opacity="0.15"/><text x="60" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">같은 기준으로 비교</text><rect x="216" y="556" width="12" height="12" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.12"/><text x="236" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">비교의 핵심</text><text x="40" y="592" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">숫자·집·이동 조건은 학습용 가정입니다. 실제 사례는 조회일과 출처를 함께 기록하세요.</text></svg>
