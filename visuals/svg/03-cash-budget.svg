<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="03-cash-budget-title 03-cash-budget-desc" id="d-03-cash-budget-root"><title id="03-cash-budget-title">집값보다 먼저 자금 계산</title><desc id="03-cash-budget-desc">보유 현금 3억원에서 비상자금 0.3억원을 남기고 가정 대출 3억원을 더하면 조달 자금은 5.7억원이며 총 필요 6.2억원보다 0.5억원 부족합니다.</desc><defs>
      <style>#d-03-cash-budget-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; }
      #d-03-cash-budget-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-03-cash-budget-root .intro { color:#4f5d75; font-size:14px; max-width:820px; margin:0 0 20px; }
      #d-03-cash-budget-root .diagram-container { width:100%; overflow-x:auto; }
      #d-03-cash-budget-root a { color:#2e5aa8; text-underline-offset:3px; }
      #d-03-cash-budget-root .foot { border-top:1px solid #bfc0c0; margin-top:20px; padding-top:12px; font-size:13px; color:#4f5d75; }
      #d-03-cash-budget-root .contents { display:flex; flex-wrap:wrap; gap:8px 20px; padding:12px 0 24px; }
      #d-03-cash-budget-root .gallery-section { margin:40px 0 56px; break-inside:avoid; }
      #d-03-cash-budget-root .lesson-link { font-size:14px; margin-top:12px; }
      #d-03-cash-budget-root .diagram-container { overflow-x:visible; }
      #d-03-cash-budget-root .contents { display:none; }
      #d-03-cash-budget-root .gallery-section { break-before:page; margin:0; }</style><marker id="d-03-cash-budget-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="d-03-cash-budget-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="d-03-cash-budget-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/><text x="40" y="68" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">현금 전부를 집에 넣지 않고, 남겨둘 돈부터 뺍니다.</text><text x="40" y="100" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">가상 집값 6억원 + 부대비용 0.2억원 / 대출 3억원은 승인 한도가 아닙니다.</text><text x="80" y="132" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">단위: 억원</text><line x1="80" y1="448" x2="880" y2="448" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="452" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">0</text><line x1="80" y1="378" x2="880" y2="378" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="382" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">1.5</text><line x1="80" y1="308" x2="880" y2="308" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="312" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">3</text><line x1="80" y1="238" x2="880" y2="238" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="242" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">4.5</text><line x1="80" y1="168" x2="880" y2="168" stroke="#2d3142" stroke-width="1" stroke-opacity="0.10" /><text x="68" y="172" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="end">6</text><line x1="80" y1="168" x2="80" y2="448" stroke="#bfc0c0" stroke-width="1" /><line x1="80" y1="448" x2="880" y2="448" stroke="#bfc0c0" stroke-width="1" /><rect x="112" y="308" width="128" height="140" fill="#f5f5f5"/><rect x="112" y="308" width="128" height="140" fill="#2d3142" stroke="#2d3142" stroke-width="1" data-role="total" data-value="3" data-name="보유 현금" fill-opacity="0.08"/><text x="176.0" y="300" fill="#2d3142" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">3</text><text x="176.0" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">보유 현금</text><line x1="240" y1="30