x1="624" y1="209" x2="688" y2="209" stroke="#2d3142" stroke-width="1" data-carry="106.7" stroke-opacity="0.55"/><rect x="688" y="209" width="128" height="239" fill="#f5f5f5"/><rect x="688" y="209" width="128" height="239" fill="#bf4520" stroke="#bf4520" stroke-width="1" data-role="total" data-value="106.7" data-name="월세 비용" fill-opacity="0.12"/><text x="752.0" y="201" fill="#bf4520" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">106.7</text><text x="752.0" y="480" fill="#bf4520" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">월세 비용</text><text x="80" y="520" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">월세 선택의 비용 = 보증금 기회비용 16.7 + 월세 90 = 106.7</text><line x1="40" y1="544" x2="920" y2="544" stroke="#bfc0c0" stroke-width="1" /><rect x="40" y="556" width="12" height="12" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.08"/><text x="60" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">합계</text><rect x="216" y="556" width="12" height="12" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="236" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">차감</text><rect x="392" y="556" width="12" height="12" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" fill-opacity="0.15"/><te