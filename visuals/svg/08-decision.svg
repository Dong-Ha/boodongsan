<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08-decision-title 08-decision-desc" id="d-08-decision-root"><title id="08-decision-title">계속 검토·보류·추가 확인</title><desc id="08-decision-desc">필수 조건과 자금을 충족하지 않으면 보류하고 중요한 자료가 없으면 추가 확인하며 두 조건이 확인되면 계속 검토하는 판단 흐름입니다.</desc><defs>
      <style>#d-08-decision-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; }
      #d-08-decision-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-08-decision-root .intro { color:#4f5d75; font-size:14px; max-width:820px; margin:0 0 20px; }
      #d-08-decision-root .diagram-container { width:100%; overflow-x:auto; }
      #d-08-decision-root a { color:#2e5aa8; text-underline-offset:3px; }
      #d-08-decision-root .foot { border-top:1px solid #bfc0c0; margin-top:20px; padding-top:12px; font-size:13px; color:#4f5d75; }
      #d-08-decision-root .contents { display:flex; flex-wrap:wrap; gap:8px 20px; padding:12px 0 24px; }
      #d-08-decision-root .gallery-section { margin:40px 0 56px; break-inside:avoid; }
      #d-08-decision-root .lesson-link { font-size:14px; margin-top:12px; }
      #d-08-decision-root .diagram-container { overflow-x:visible; }
      #d-08-decision-root .contents { display:none; }
      #d-08-decision-root .gallery-section { break-before:page; margin:0; }</style><marker id="d-08-decision-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="d-08-decision-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="d-08-decision-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/><text x="40" y="56" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">가격 점수보다 필수 조건과 확인 상태를 먼저 봅니다.</text><line x1="480" y1="120" x2="480" y2="156" stroke="#4f5d75" stroke-width="1" marker-end="url(#d-08-decision-arrow)"/><line x1="356" y1="200" x2="280" y2="200" stroke="#4f5d75" stroke-width="1" marker-end="url(#d-08-decision-arrow)"/><line x1="480" y1="244" x2="480" y2="316" stroke="#4f5d75" stroke-width="1" marker-end="url(#d-08-decision-arrow)"/><line x1="356" y1="360" x2="280" y2="360" stroke="#4f5d75" stroke-width="1" marker-end="url(#d-08-decision-arrow)"/><line x1="480" y1="404" x2="480" y2="464" stroke="#4f5d75" stroke-width="1" marker-end="url(#d-08-decision-arrow)"/><rect x="288" y="176" width="60" height="16" fill="#f5f5f5"/><text x="318.0" y="188" fill="#5a6580" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">아니오</text><rect x="488" y="268" width="56" height="16" fill="#f5f5f5"/><text x="516.0" y="280" fill="#5a6580" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">예</text><rect x="288" y="336" width="60" height="16" fill="#f5f5f5"/><text x="318.0" y="348" fill="#5a6580" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">아니오</text><rect x="488" y="416" width="56" height="16" fill="#f5f5f5"/><text x="516.0" y="428" fill="#5a6580" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">예</text><rect x="360" y="72" width="240" height="48" fill="#f5f5f5" rx="20"/><rect x="360" y="72" width="240" height="48" fill="#ffffff" stroke="#2d3142" stroke-width="1" rx="20"/><text x="480.0" y="100.0" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">후보 집 한 곳</text><polygon points="480,156.0 604.0,200 480,244.0 356.0,200" fill="#f5f5f5"/><polygon points="480,156.0 604.0,200 480,244.0 356.0,200" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="480" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">필수 조건과</text><text x="480" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">자금을 충족하나요?</text><rect x="80" y="168" width="200" height="64" fill="#f5f5f5" rx="20"/><rect x="80" y="168" width="200" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1" rx="20"/><text x="180.0" y="196.0" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">보류</text><text x="180.0" y="216.0" fill="#2d3142" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">조건 또는 예산 재검토</text><polygon points="480,316.0 604.0,360 480,404.0 356.0,360" fill="#f5f5f5"/><polygon points="480,316.0 604.0,360 480,404.0 356.0,360" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="480" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">중요한 자료를</text><text x="480" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">확인했나요?</text><rect x="80" y="328" width="200" height="64" fill="#f5f5f5" rx="20"/><rect x="80" y="328" width="200" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1" rx="20"/><text x="180.0" y="356.0" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">추가 확인</text><text x="180.0" y="376.0" fill="#2d3142" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">근거 없이 점수 채우지 않기</text><rect x="360" y="464" width="240" height="56" fill="#f5f5f5" rx="20"/><rect x="360" y="464" width="240" height="56" fill="#ffffff" stroke="#2d3142" stroke-width="1" rx="20"/><text x="480.0" y="488.0" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">계속 검토</text><text x="480.0" y="508.0" fill="#2d3142" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">다음 확인 단계로 이동</text><line x1="40" y1="544" x2="920" y2="544" stroke="#bfc0c0" stroke-width="1" /><rect x="40" y="556" width="12" height="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="60" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">조건에 따른 분기</text><rect x="216" y="556" width="12" height="12" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="236" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">첫 판단</text><text x="40" y="592" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">계속 검토는 매수 추천·대출 승인·계약 완료를 뜻하지 않습니다. 10강의 판단문을 작성하세요.</text></svg>
