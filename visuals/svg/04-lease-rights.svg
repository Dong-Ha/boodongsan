<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="04-lease-rights-title 04-lease-rights-desc" id="d-04-lease-rights-root"><title id="04-lease-rights-title">보증금 보호의 조건</title><desc id="04-lease-rights-desc">주택 인도와 전입신고를 갖추면 일반적으로 다음 날 대항력이 생기고 확정일자를 함께 갖추면 우선변제권의 요건과 순위를 확인하는 흐름입니다.</desc><defs>
      <style>#d-04-lease-rights-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; }
      #d-04-lease-rights-root { color: #2d3142; font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      #d-04-lease-rights-root .intro { color:#4f5d75; font-size:14px; max-width:820px; margin:0 0 20px; }
      #d-04-lease-rights-root .diagram-container { width:100%; overflow-x:auto; }
      #d-04-lease-rights-root a { color:#2e5aa8; text-underline-offset:3px; }
      #d-04-lease-rights-root .foot { border-top:1px solid #bfc0c0; margin-top:20px; padding-top:12px; font-size:13px; color:#4f5d75; }
      #d-04-lease-rights-root .contents { display:flex; flex-wrap:wrap; gap:8px 20px; padding:12px 0 24px; }
      #d-04-lease-rights-root .gallery-section { margin:40px 0 56px; break-inside:avoid; }
      #d-04-lease-rights-root .lesson-link { font-size:14px; margin-top:12px; }
      #d-04-lease-rights-root .diagram-container { overflow-x:visible; }
      #d-04-lease-rights-root .contents { display:none; }
      #d-04-lease-rights-root .gallery-section { break-before:page; margin:0; }</style><marker id="d-04-lease-rights-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="d-04-lease-rights-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker><marker id="d-04-lease-rights-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/><text x="40" y="60" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">대항력과 우선변제권은 갖춰야 할 조건이 있습니다.</text><line x1="224" y1="128" x2="224" y2="164" stroke="#4f5d75" stroke-width="1" marker-end="url(#d-04-lease-rights-arrow)"/><line x1="344" y1="216" x2="488" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#d-04-lease-rights-arrow)"/><line x1="224" y1="268" x2="224" y2="424" stroke="#4f5d75" stroke-width="1" marker-end="url(#d-04-lease-rights-arrow)"/><line x1="652" y1="256" x2="652" y2="320" stroke="#4f5d75" stroke-width="1" marker-end="url(#d-04-lease-rights-arrow)"/><line x1="652" y1="384" x2="652" y2="432" stroke="#4f5d75" stroke-width="1" marker-end="url(#d-04-lease-rights-arrow)"/><rect x="380" y="192" width="64" height="16" fill="#f5f5f5"/><text x="412.0" y="204" fill="#5a6580" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">완료</text><rect x="232" y="332" width="88" height="16" fill="#f5f5f5"/><text x="276.0" y="344" fill="#5a6580" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">미완료</text><rect x="104" y="80" width="240" height="48" fill="#f5f5f5" rx="6"/><rect x="104" y="80" width="240" height="48" fill="#ffffff" stroke="#2d3142" stroke-width="1" rx="6"/><text x="224.0" y="108.0" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">주택 임대차를 확인</text><polygon points="224,164.0 344.0,216 224,268.0 104.0,216" fill="#f5f5f5"/><polygon points="224,164.0 344.0,216 224,268.0 104.0,216" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="224" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">집을 인도받고</text><text x="224" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">전입신고를 마쳤나요?</text><rect x="104" y="424" width="240" height="64" fill="#f5f5f5" rx="20"/><rect x="104" y="424" width="240" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1" rx="20"/><text x="224.0" y="452.0" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">요건부터 확인</text><text x="224.0" y="472.0" fill="#2d3142" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">전입신고만으로 끝나지 않음</text><rect x="488" y="176" width="328" height="80" fill="#f5f5f5" rx="6"/><rect x="488" y="176" width="328" height="80" fill="#bf4520" stroke="#bf4520" stroke-width="1" rx="6" fill-opacity="0.08"/><text x="652.0" y="212.0" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">대항력</text><text x="652.0" y="232.0" fill="#2d3142" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">일반적으로 다음 날부터</text><rect x="488" y="320" width="328" height="64" fill="#f5f5f5" rx="6"/><rect x="488" y="320" width="328" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1" rx="6"/><text x="652.0" y="348.0" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">확정일자도 함께 확인</text><text x="652.0" y="368.0" fill="#2d3142" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">계약서의 날짜를 공적으로 확인</text><rect x="488" y="432" width="328" height="64" fill="#f5f5f5" rx="20"/><rect x="488" y="432" width="328" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1" rx="20"/><text x="652.0" y="460.0" fill="#2d3142" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">대항요건 + 확정일자</text><text x="652.0" y="480.0" fill="#2d3142" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">우선변제권의 요건·순위 확인</text><line x1="40" y1="544" x2="920" y2="544" stroke="#bfc0c0" stroke-width="1" /><rect x="40" y="556" width="12" height="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="60" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">권리의 조건</text><rect x="216" y="556" width="12" height="12" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="236" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">핵심 시점</text><text x="40" y="592" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">4강·공식 법령 참조 · 반환보증은 별도 심사·절차 · 전액 회수를 보장하는 그림이 아닙니다.</text></svg>
