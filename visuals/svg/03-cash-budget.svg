2.0" y="174" fill="#bf4520" font-size="12" font-weight="500" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">5.7</text><text x="752.0" y="480" fill="#bf4520" font-size="12" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="middle">조달 가능 합계</text><text x="80" y="520" fill="#2d3142" font-size="14" font-weight="600" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">총 필요 6.2억원 − 조달 가능 5.7억원 = 부족 0.5억원</text><line x1="40" y1="544" x2="920" y2="544" stroke="#bfc0c0" stroke-width="1" /><rect x="40" y="556" width="12" height="12" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.08"/><text x="60" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">합계</text><rect x="216" y="556" width="12" height="12" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><text x="236" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">차감</text><rect x="392" y="556" width="12" height="12" fill="#4f5d75" stroke="#4f5d75" stroke-width="1" fill-opacity="0.15"/><text x="412" y="568" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">더하는 금액</text><text x="40" y="592" fill="#4f5d75" font-size="12" font-weight="400" font-family="&#x27;Geist&#x27;, &#x27;Noto Sans KR&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Malgun Gothic&#x27;, system-ui, sans-serif" text-anchor="start">가상 계산 · 월 비용과 초기 현금은 서로 다른 계산입니다.</text></svg>
