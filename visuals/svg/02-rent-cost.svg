<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="02-rent-cost-title 02-rent-cost-desc" id="d-02-rent-cost-root"><title id="02-rent-cost-title">전세와 월세의 비용 비교</title><desc id="02-rent-cost-desc">같은 집에 자기자금을 쓰고 연 기회비용 4%를 가정하면 월 비교 비용이 100만원에서 106.7만원으로 바뀌는 계산입니다.</desc><defs>
      <style>#d-02-rent-cost-root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; }
